name: Build check

# Checks that the source builds on Windows, macOS and Linux.
#
# This workflow deliberately publishes NOTHING: it does not package the plugin, upload artifacts or create releases.
# Compiled plugins are sold, not hosted in this repository, and artifacts of a public repository can be downloaded by
# any signed-in GitHub user. Release builds are made in a separate private repository (see distribution/private-release-build.yml).
# distribution/check-no-binaries.sh blocks a push if this file ever gains an upload or release step.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-universal
            os: macos-14
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev ninja-build

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DDESIDUOUS_BUILD_TESTS=OFF

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build -G Xcode -DDESIDUOUS_BUILD_TESTS=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDESIDUOUS_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --target deSIDuous_VST3 --parallel

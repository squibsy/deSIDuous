name: Build

# Builds the inSIDious VST3 for Windows, macOS (universal) and Linux.
# - every push to main: zips are kept as workflow artifacts
# - pushing a v* tag (or running manually with a tag): zips are attached to that GitHub release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the builds to (leave empty to only build)'
        required: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-universal
            os: macos-14
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev ninja-build

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DINSIDIOUS_BUILD_TESTS=OFF

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build -G Xcode -DINSIDIOUS_BUILD_TESTS=OFF
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DINSIDIOUS_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --target inSIDious_VST3 --parallel

      - name: Label
        id: label
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG:-$(git rev-parse --short HEAD)}" >> "$GITHUB_OUTPUT"

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - build/inSIDious_artefacts/Release/VST3/inSIDious.vst3

      - name: Package
        shell: bash
        run: |
          ZIP="inSIDious-${{ steps.label.outputs.version }}-${{ matrix.name }}-vst3.zip"
          cd build/inSIDious_artefacts/Release/VST3
          case "${{ runner.os }}" in
            Windows) 7z a -tzip "$GITHUB_WORKSPACE/$ZIP" inSIDious.vst3 ;;
            macOS)   ditto -c -k --keepParent inSIDious.vst3 "$GITHUB_WORKSPACE/$ZIP" ;;
            Linux)   zip -r -y "$GITHUB_WORKSPACE/$ZIP" inSIDious.vst3 ;;
          esac
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ZIP }}

  release:
    needs: build
    if: github.ref_type == 'tag' || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "inSIDious $TAG" --generate-notes
          gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
